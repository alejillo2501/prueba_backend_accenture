spring:
  application:
    name: franchise-api

  # Configuración R2DBC (Reactiva) para MySQL
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franchise_db}??sslMode=DISABLED
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  # Flyway para migraciones automáticas (opcional pero recomendado)
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:franchise_db}
    user: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    baseline-on-migrate: true
    validate-on-migrate: true


# Configuración del servidor
server:
  port: ${SERVER_PORT:8080}
  netty:
    connection-timeout: 30s
    max-keep-alive-requests: 100

# Actuator para health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    r2dbc:
      enabled: true

# Logging detallado para desarrollo
logging:
  level:
    com.accenture.franchise: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/franchise-api.log
